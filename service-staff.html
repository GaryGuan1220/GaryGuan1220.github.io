<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReOwn 岗位工作台</title><link rel="stylesheet" href="service-operations.css"><style>body{font:16px system-ui;margin:0;background:#f7f8fa;color:#202630}main{max-width:1200px;margin:auto;padding:24px}header,.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #bec7d2;border-radius:8px}button{cursor:pointer;background:white;color:#a82037}button:disabled{opacity:.5;cursor:wait}label{display:grid;gap:6px;margin:12px 0}textarea{min-height:80px}section{background:white;border:1px solid #d8dee6;border-radius:12px;padding:18px;margin:16px 0}.layout{display:grid;grid-template-columns:minmax(250px,1fr) minmax(300px,2fr);gap:20px}.row{display:flex;flex-direction:column;align-items:flex-start;gap:7px;width:100%;text-align:left;margin:8px 0;overflow-wrap:anywhere}dt{color:#5e6975;font-size:.9em;margin-top:14px}dd{margin:4px 0;overflow-wrap:anywhere}dialog{width:min(650px,85vw);max-height:85vh;overflow:auto;border:1px solid #d8dee6;border-radius:14px}#status{white-space:pre-wrap;color:#a82037}.footnote{font-size:.9em;color:#5e6975}img{max-width:100%;max-height:250px}#login{max-width:460px}@media(max-width:700px){.layout{display:block}main{padding:14px}}[hidden]{display:none!important}</style></head><body><main><header><h1>ReOwn 岗位工作台</h1><button id="logout" hidden>退出登录</button></header><p>调度处理人员安排；财务核对款项；复核人员审批另一人的付款申请。管理员在原后台管理岗位授权。</p><p id="status" role="status"></p><button id="reconcile" hidden>核对上次提交结果</button><form id="login"><label>工作账号邮箱<input name="email" type="email" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录岗位工作台</button></form><div id="workspace" hidden><div class="toolbar"><label>当前岗位<select id="role"></select></label><input id="search" aria-label="查找本岗位记录" placeholder="查找本岗位记录"><button id="refresh">刷新记录</button><button id="bookings" hidden>预约取货排班</button><button id="deliveries" hidden>配送调度记录</button><button id="targets" hidden>应付退款与回款</button></div><div id="targetList"></div><div class="layout"><section><h2>岗位记录</h2><div id="list"></div><button id="more" hidden>加载更多</button></section><section id="detail"><p>选择一条记录查看。</p></section></div></div><dialog id="dialog"></dialog></main><script src="service-staff.js"></script></body></html>
